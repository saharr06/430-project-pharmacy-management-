{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MedCare Login</title>
    <link rel="stylesheet" href="{% static 'core/style.css' %}">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            width: 380px;
            max-width: 90%;
            box-shadow: 0 8px 30px #295e4b20;
        }

        .login-card h1 {
            color: #297d67;
            text-align: center;
        }

        .login-card label {
            display: block;
            margin-top: 18px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .login-card button {
            width: 100%;
            margin-top: 24px;
        }

        .error {
            color: #b53030;
        }
    </style>
</head>
<body>

<div class="login-card">
    <h1>✚ MedCare</h1>
    <p style="text-align:center">
        Pharmacy Management Login
    </p>

    {% if form.errors %}
        <p class="error">
            Invalid username or password.
        </p>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <label for="id_username">Username</label>
        {{ form.username }}

        <label for="id_password">Password</label>
        {{ form.password }}

        <input type="hidden"
               name="next"
               value="{{ next }}">

        <button type="submit" class="btn">
            Login
        </button>
    </form>
</div>

</body>
</html>
