{% extends 'core/base.html' %}
{% block title %}New Sale{% endblock %}
{% block content %}
<section class="panel formpanel"><p class="subtitle">Sales use earliest-expiring, unexpired stock first. Check allergies manually before confirming: automatic checks only match recorded allergy names against medication names.</p><form method="post">{% csrf_token %}<div class="field"><label for="patient">Patient (optional)</label><select id="patient" name="patient"><option value="">Walk-in customer</option>{% for patient in patients %}<option value="{{ patient.pk }}">{{ patient.full_name }} (ID {{ patient.pk }})</option>{% endfor %}</select></div><div class="field"><label for="medication">Medication</label><select id="medication" name="medication" required>{% for med in medications %}<option value="{{ med.pk }}">{{ med.name }} — {{ med.price }} per unit ({{ med.quantity }} total)</option>{% endfor %}</select></div><div class="field"><label for="quantity">Quantity sold</label><input type="number" id="quantity" name="quantity" min="1" required></div><div class="field"><label for="pharmacist">Dispensing pharmacist</label><input id="pharmacist" name="pharmacist" required maxlength="120"></div><button class="btn" type="submit">Complete sale</button></form></section>
{% endblock %}
